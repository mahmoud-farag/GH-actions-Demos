name: matrix demo
on:
  push:
    branches: [main]
jobs:
  build-job:
    continue-on-error: true # continue the job even if any job failed in any OS/nodejsverions
    strategy:
      matrix:
        node-version: [16.x, 18.x, 24.x]
        operating-system: [ubuntu-latest, windows-latest]
        include:
          - node-version: 16.x
            operating-system: windows-latest
        exclude:
          - node-version: 24.x
            operating-system: windows-latest
    runs-on: ${{ matrix.operating-system }}
    steps:
      - name: get Code
        uses: actions/checkout@v3
      - name: install Nodejs
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: install dependencies
        run: npm ci
      - name: build Project
        run: npm run build
name: Job Artifact demo
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
    
jobs:
  test-job:
    runs-on: ubuntu-latest
    steps:
      - name: Get The Code
        uses: actions/checkout@v3
      - name: cache node dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: node-dependencies-${{ hashFiles('**/package-lock.json') }}
      - name: install dependencies
        run: npm ci
      - name: lint Code
        run: npm run lint
      - name: Test Code
        id: test-step
        run: npm run test
      - name: Upload Test Artifact
        if: failure() && steps.test-step.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-report-artifact
          path: test-report.json
  build-job:
    runs-on: ubuntu-latest
    needs: test-job
    outputs:
      script-file: ${{ steps.unique-id.outputs.script-file }}
    steps:
      - name: Get The Code
        uses: actions/checkout@v3
      - name: cache node dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: node-dependencies-${{ hashFiles('**/package-lock.json') }}
      - name: install dependencies
        run: npm ci
      - name: Build website
        run: npm run build
      - name: Publish JS files to the deploy-job
        id: unique-id
        run: find dist/assets/*.js -type f -execdir echo '::set-output name=script-file::{}' ';'
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: dist
          # path: |  
          #   dist
          #   package.json

  deploy-job:
    runs-on: ubuntu-latest
    needs: build-job
    steps:
      - name: Get build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact #i have to use the same name as the uploaded artifact in the previous job
      - name: List the build artifact
        run: ls
      - name: Display the JS files name
        run: echo "the JS file name is ${{ needs.build-job.outputs.script-file }}"
      - name: Deploy website
        run: echo "Deploying website..."
    


















